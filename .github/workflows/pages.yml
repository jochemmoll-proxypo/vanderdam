name: Website publiceren
on:
  push:
    branches: [main]
    paths:
      - index.html
      - CNAME
      - assets/**
      - stories/**
      - .github/workflows/pages.yml
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - name: Maak publicatiemap
        run: |
          mkdir public
          cp index.html public/
          if [ -f CNAME ]; then cp CNAME public/; fi
          cp -r assets stories public/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publiceer op GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
