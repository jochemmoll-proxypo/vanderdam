name: Dagelijks sportverhaal
on:
  schedule:
    - cron: '15 5 * * *'
    - cron: '15 7 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-sports-story
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Research, schrijf en controleer
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/publish_daily.py
      - name: Bewaar het verhaal
        run: |
          if git diff --quiet -- stories/index.json; then
            echo "Geen nieuw verhaal; archief blijft ongewijzigd."
            exit 0
          fi
          git config user.name "This Day in Sports"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stories/index.json
          git commit -m "Publish today's sports history story"
          git push
  deploy:
    needs: research
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
