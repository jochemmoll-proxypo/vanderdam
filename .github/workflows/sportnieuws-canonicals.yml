name: Sportnieuws canonical monitor
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      test_email:
        description: Send a labeled test email to both alert recipients
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: sportnieuws-canonical-monitor
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check newly published articles and email canonical alerts
        id: monitor
        env:
          SEND_TEST_EMAIL: ${{ inputs.test_email || false }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: |
          if [ "$SEND_TEST_EMAIL" = "true" ]; then
            python scripts/check_canonicals.py --test-email
          fi
          python scripts/check_canonicals.py
      - name: Save checked articles and retry queue
        if: ${{ always() && steps.monitor.outcome != 'skipped' }}
        run: |
          if git diff --quiet -- monitoring/sportnieuws-state.json; then
            exit 0
          fi
          git config user.name "Sportnieuws canonical monitor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monitoring/sportnieuws-state.json
          git commit -m "Record Sportnieuws canonical checks"
          git pull --rebase origin main
          git push origin HEAD:main
